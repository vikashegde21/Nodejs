name: Pylint

on: [push, pull_request]

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.8

      - name: Install pylint
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Run pylint
        run: |
          if git ls-files '*.py' | grep -q .; then
            pylint $(git ls-files '*.py')
          else
            echo "No Python files to lint."
          fi
